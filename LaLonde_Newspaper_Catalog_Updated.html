<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLonde Historical Museum — Newspaper Catalog</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f0e8;color:#29251f}
header{background:#314d38;color:#fff;padding:22px 28px}
header h1{margin:0;font-family:Georgia,serif}
header p{margin:6px 0 0}
main{max-width:1200px;margin:24px auto;padding:0 18px}
.card{background:#fff;border:1px solid #d5cec0;border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 2px 7px #00000012}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{font-weight:bold;font-size:13px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #bdb5a7;border-radius:6px;background:#fff}
textarea{min-height:70px}
button{border:0;border-radius:6px;padding:10px 14px;margin:6px 4px 0 0;cursor:pointer;font-weight:bold}
.primary{background:#314d38;color:white}.secondary{background:#e3ded3}.danger{background:#9b3d32;color:white}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eee8dc;padding:12px 18px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #ddd5c7;padding:9px;text-align:left;vertical-align:top}
th{background:#eee8dc}
.actions button{padding:6px 8px;font-size:12px}
#search{max-width:500px}
.small{font-size:12px;color:#665f55}
.hidden{display:none}
@media print{header,.no-print,.actions{display:none!important} body{background:white}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header>
<h1>LaLonde Historical Museum</h1>
<p>Newspaper Catalog — Offline Edition</p>
</header>
<main>
<div class="card no-print">
<h2 id="formTitle">Add Newspaper Issue</h2>
<div class="grid">
<div><label>Catalog Number</label><input id="catalog" placeholder="LHM-NEWS-ADW-1947-03-14"></div>
<div><label>Item Type / Newspaper Name</label><input id="paper" placeholder="Clipping, Full Newspaper, or newspaper name"></div>
<div><label>Date / Year</label><input id="date" type="text" placeholder="e.g. Oct 2011 or Year unknown"></div>
<div><label>Edition / Issue No.</label><input id="issue"></div>
<div><label>Cabinet</label><input id="cabinet" placeholder="1"></div>
<div><label>Drawer</label><input id="drawer" placeholder="2"></div>
<div><label>Condition</label><select id="condition"><option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option><option>Fragile</option></select></div>
<div><label>Digital Scan</label><select id="scan"><option>Yes</option><option>No</option><option>Partial</option></select></div>
</div>
<div style="margin-top:12px"><label>Notes</label><textarea id="notes" placeholder="Articles, people, events, damage, duplicates, etc."></textarea></div>
<button class="primary" onclick="saveItem()">Save Newspaper</button>
<button class="secondary" onclick="clearForm()">Clear</button>
<input type="hidden" id="editIndex" value="">
</div>

<div class="card no-print">
<h2>Search Catalog</h2>
<input id="search" oninput="render()" placeholder="Search catalog number, newspaper, date, cabinet, drawer, notes...">
<div class="stats" id="stats"></div>
<div>
<button class="secondary" onclick="exportCSV()">Export CSV</button>
<button class="secondary" onclick="backup()">Backup Catalog</button>
<button class="secondary" onclick="document.getElementById('restore').click()">Restore Backup</button>
<button class="secondary" onclick="window.print()">Print Catalog</button>
<input id="restore" class="hidden" type="file" accept=".json" onchange="restore(event)">
</div>
<p class="small">Your catalog is stored on this computer in this browser. No internet connection is required.</p>
</div>

<div class="card">
<h2>Newspaper Collection</h2>
<table>
<thead><tr><th>Catalog #</th><th>Newspaper</th><th>Date</th><th>Location</th><th>Condition</th><th>Scan</th><th class="no-print">Actions</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>

function val(id){return document.getElementById(id).value.trim()}
function saveItem(){
 const item={catalog:val('catalog'),paper:val('paper'),date:val('date'),issue:val('issue'),
 cabinet:val('cabinet'),drawer:val('drawer'),condition:val('condition'),scan:val('scan'),notes:val('notes')};
 if(!item.catalog||!item.paper||!item.date){alert('Please enter at least a Catalog Number, Item Type, and Date / Year.');return}
 const idx=document.getElementById('editIndex').value;
 if(idx==='') items.push(item); else items[+idx]=item;
 localStorage.setItem(KEY,JSON.stringify(items)); clearForm(); render();
}
function clearForm(){
 ['catalog','paper','date','issue','cabinet','drawer','notes'].forEach(x=>document.getElementById(x).value='');
 document.getElementById('condition').value='Excellent'; document.getElementById('scan').value='Yes';
 document.getElementById('editIndex').value=''; document.getElementById('formTitle').textContent='Add Newspaper Issue';
}
function editItem(i){
 const x=items[i];
 ['catalog','paper','date','issue','cabinet','drawer','notes'].forEach(k=>document.getElementById(k).value=x[k]||'');
 ['condition','scan'].forEach(k=>document.getElementById(k).value=x[k]||'');
 document.getElementById('editIndex').value=i; document.getElementById('formTitle').textContent='Edit Newspaper Issue';
 window.scrollTo({top:0,behavior:'smooth'});
}
function delItem(i){if(confirm('Delete this newspaper record?')){items.splice(i,1);localStorage.setItem(KEY,JSON.stringify(items));render()}}
function render(){
 const q=val('search').toLowerCase();
 const filtered=items.map((x,i)=>({x,i})).filter(o=>Object.values(o.x).join(' ').toLowerCase().includes(q));
 document.getElementById('rows').innerHTML=filtered.map(o=>{
  const x=o.x;
  return `<tr><td><b>${esc(x.catalog)}</b>${x.issue?'<br><span class="small">Issue '+esc(x.issue)+'</span>':''}</td>
  <td>${esc(x.paper)}</td><td>${esc(x.date)}</td><td>Cabinet ${esc(x.cabinet)}<br>Drawer ${esc(x.drawer)}</td>
  <td>${esc(x.condition)}</td><td>${esc(x.scan)}</td>
  <td class="actions no-print"><button class="secondary" onclick="editItem(${o.i})">Edit</button><button class="danger" onclick="delItem(${o.i})">Delete</button></td></tr>`
 }).join('') || '<tr><td colspan="7">No newspapers found.</td></tr>';
 const papers=new Set(items.map(x=>x.paper).filter(Boolean)).size;
 document.getElementById('stats').innerHTML=`<div class="stat"><b>${items.length}</b><br>Total Issues</div><div class="stat"><b>${papers}</b><br>Newspapers</div><div class="stat"><b>${items.filter(x=>x.scan==='Yes').length}</b><br>Scanned</div>`;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function exportCSV(){
 const headers=['Catalog Number','Newspaper','Date','Issue','Cabinet','Drawer','Condition','Digital Scan','Notes'];
 const lines=[headers,...items.map(x=>headers.map((_,i)=>[x.catalog,x.paper,x.date,x.issue,x.cabinet,x.drawer,x.condition,x.scan,x.notes][i]))]
 .map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(',')).join('\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines],{type:'text/csv'}));a.download='LaLonde_Newspaper_Catalog.csv';a.click();
}
function backup(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));a.download='LaLonde_Newspaper_Catalog_Backup.json';a.click();
}
function restore(e){
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;const byId=new Map(items.map(x=>[x.catalog,x]));d.forEach(x=>{if(!byId.has(x.catalog))items.push(x);else if(!x.catalog)items.push(x)});localStorage.setItem(KEY,JSON.stringify(items));render();alert('Backup merged with the new clipping entries.')}catch{alert('That backup file is not valid.')}};r.readAsText(f);
}
