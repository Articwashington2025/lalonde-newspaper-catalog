<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLonde Historical Museum — Newspaper Catalog</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f0e8;color:#29251f}
header{background:#314d38;color:#fff;padding:22px 28px}
header h1{margin:0;font-family:Georgia,serif}
header p{margin:6px 0 0}
main{max-width:1200px;margin:24px auto;padding:0 18px}
.card{background:#fff;border:1px solid #d5cec0;border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 2px 7px #00000012}
label{font-weight:bold;font-size:13px}
input{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #bdb5a7;border-radius:6px}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eee8dc;padding:12px 18px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #ddd5c7;padding:9px;text-align:left}
th{background:#eee8dc;font-weight:bold}
#search{max-width:500px}
.small{font-size:12px;color:#665f55}
</style>
</head>
<body>
<header>
<h1>LaLonde Historical Museum</h1>
<p>Newspaper Catalog — Public View</p>
</header>
<main>
<div class="card">
<h2>Search Catalog</h2>
<input id="search" oninput="render()" placeholder="Search catalog number, newspaper, date...">
<div class="stats" id="stats"></div>
</div>

<div class="card">
<h2>Newspaper Collection</h2>
<table>
<thead><tr><th>Catalog #</th><th>Newspaper</th><th>Date</th><th>Location</th><th>Condition</th><th>Scan</th><th>Notes</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>

  {"catalog":"LHM-NEWS-ADW-206-03-01","paper":"Aberdeen Daily World","date":"2026-01-03","issue":"Weekend Edition","cabinet":"1","drawer":"3","condition":"Excellent","scan":"No","notes":""},

function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const filtered=items.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));
 document.getElementById('rows').innerHTML=filtered.map(x=>`<tr><td><b>${x.catalog}</b><br><span class="small">${x.issue}</span></td><td>${x.paper}</td><td>${x.date}</td><td>Cabinet ${x.cabinet}<br>Drawer ${x.drawer}</td><td>${x.condition}</td><td>${x.scan}</td><td class="small">${x.notes}</td></tr>`).join('') || '<tr><td colspan="7">No newspapers found.</td></tr>';
 const papers=new Set(items.map(x=>x.paper)).size;
 document.getElementById('stats').innerHTML=`<div class="stat"><b>${items.length}</b><br>Total Issues</div><div class="stat"><b>${papers}</b><br>Newspapers</div>`;
}
render();
</script>
</main>
</body>
</html>
